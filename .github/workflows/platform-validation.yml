name: ALZ - Platfform Validation

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

jobs:
  validate:
    name: Validate Bicep & Security
    runs-on: ubuntu-latest
    environment: Sandbox

    env:
      LOCATION: canadaeast
      ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}   # ID du management group racine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}          

      - name: Install Bicep
        run: az bicep install

      # 🔎 Build & Lint tous les fichiers Bicep
      - name: Build & Lint all Bicep files
        run: |
          echo "=== Bicep Validation ==="
          for file in $(find . -name '*.bicep' -not -path '*/\.*'); do
            echo "Building $file"
            az bicep build --file "$file"
            az bicep lint --file "$file"
          done

      # 🔎 Validation des fichiers de paramètres pour la Gestion de la LZ Platform
      - name: Validate parameter files for platform LZ (Management Group scope)
        run: |
          echo "=== Validating Parameter Files for platform LZ ==="
            az deployment mg validate \
              --management-group-id $ROOT_MG_ID \
              --location $LOCATION \
              --template-file platform-lz/platform.bicep \
              --parameters platform-lz/platform.bicepparam || true


      # 🔎 Validation des fichiers de paramètres pour la Gestion de la LZ Identity
      # - name: Validate parameter files for Identity LZ
      #   run: |
      #     echo "=== Validating Parameter Files for Identity LZ ==="
      #       az deployment sub validate \
      #         --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
      #         --location $LOCATION \
      #         --template-file identity-lz/identity.bicep \
      #         --parameters identity-lz/identity.bicepparam || true


      # 🔎 Validation des fichiers de paramètres pour la Gestion de la LZ Connectivity
      # - name: Validate parameter files for Connectivity LZ
      #   run: |
      #     echo "=== Validating Parameter Files at MG scope ==="
      #     for param in $(find . -name '*.bicepparam' -not -name 'connectivity.bicepparam'); do
      #       echo "Validating $param"
      #       az deployment mg validate \
      #         --management-group-id $ROOT_MG_ID \
      #         --location $LOCATION \
      #         --template-file connectivity.bicep \
      #         --parameters "$param" || true
      #     done

      # 🔎 Validation du déploiement RG au niveau subscription
      # - name: Validate RG deployment at subscription scope
      #   run: |
      #     echo "=== Validating RG Deployment at Sub scope ==="
      #     az deployment sub validate \
      #       --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \  
      #       --location $LOCATION \
      #       --template-file rg-deployment.bicep \
      #       --parameters rg-deployment.bicepparam || true

      # 🔎 What-If déploiement des ressources Platform-LZ au niveau du management group racine
      - name: Platform-LZ Resources Deployment What-If
        run: |
          az deployment mg what-if \
            --management-group-id $ROOT_MG_ID \
            --location $LOCATION \
            --template-file platform-lz/platform.bicep \
            --parameters platform-lz/platform.bicepparam
        continue-on-error: true

      # 🔎 What-If pour le déploiement de la landing zone Identity-LZ
      # - name: Identity-LZ Resources Deployment What-If
      #   run: |
      #     az deployment sub what-if \
      #       --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
      #       --location $LOCATION \
      #       --template-file identity-lz/identity.bicep \
      #       --parameters identity-lz/identity.bicepparam
      #   continue-on-error: true

      # 🔐 PSRule for Azure
      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputType: repository
          inputPath: .
        continue-on-error: false

      # 🔐 Checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: .
          soft_fail: false

      - name: Azure Logout
        if: always()
        run: az logout

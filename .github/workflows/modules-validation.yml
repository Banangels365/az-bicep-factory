name: ALZ - Modules Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'modules/**'
      - '.github/workflows/modules-validation.yml'

  pull_request:
    branches-ignore:
      - main
    paths:
      - 'modules/**'
      - '.github/workflows/modules-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./modules

# env:
#   LOCATION: canadaeast

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.2934.0
        with:
          framework: bicep
          directory: ./modules
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./modules

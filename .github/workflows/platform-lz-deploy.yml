name: ALZ - Platform-LZ Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-deploy.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast


jobs:

  # =========================================================
  # JOB 1 - VALIDATION & SECURITY
  # =========================================================

  validate:
    name: Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build & Lint Bicep
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: false

  # =========================================================
  # JOB 2 - WHAT-IF
  # =========================================================

  whatif:
    name: What-If Analysis
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: What-If Platform-LZ
        run: |
          az deployment mg what-if \
            --name platform-lz-whatif \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

      - name: Azure Logout
        if: always()
        run: az logout

  # =========================================================
  # JOB 3 - DEPLOYMENT
  # =========================================================

  deploy:
    name: Deploy Platform-LZ
    runs-on: ubuntu-latest
    needs: whatif
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Deploy Platform-LZ
        run: |
          az deployment mg create \
            --name platform-lz-deploy \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

      - name: Azure Logout
        if: always()
        run: az logout
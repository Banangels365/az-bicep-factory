name: ALZ - Platform-LZ Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast
  # ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

  # =========================================================
  # JOB 3 - AZURE VALIDATION
  # =========================================================

  validate:
    name: Azure Validate
    runs-on: ubuntu-latest
    needs: security
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

  # =========================================================
  # JOB 4 - WHAT-IF SUMMARY
  # =========================================================

  whatif-summary:
    name: What-If Change Summary
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Change Summary
        shell: pwsh
        run: |
          # 1. Capture la sortie brute en texte
          $jsonRaw = az deployment mg what-if `
              --name platform-lz-whatif `
              --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} `
              --location $lOCATION `
              --template-file ./platform.bicep `
              --parameters ./platform.bicepparam `
              --query "changes" `
              --output json | Out-String

          # 2. Nettoyage agressif : supprime tout ce qui n'est pas JSON
          #    - enlève les caractères parasites
          #    - remplace NaN par null
          #    - supprime les lignes hors JSON
          $jsonClean = $jsonRaw `
              -replace 'NaN', 'null' `
              -replace '^\s*NaN.*$', '' `
              -replace '^\s*$', '' `
              -replace '[^\x20-\x7E\r\n\t]', ''  # supprime les caractères non imprimables

          # 3. Conversion JSON
          $json = $jsonClean | ConvertFrom-Json

          # 4. Comptage
          $created  = ($json | Where-Object changeType -eq "Create").Count
          $deleted  = ($json | Where-Object changeType -eq "Delete").Count
          $modified = ($json | Where-Object changeType -eq "Modify").Count
          $nochange = ($json | Where-Object changeType -eq "NoChange").Count

          Write-Host ""
          Write-Host "==================================="
          Write-Host "Platform-LZ Change Summary"
          Write-Host "==================================="
          Write-Host "Created   : $created"
          Write-Host "Deleted   : $deleted"
          Write-Host "Modified  : $modified"
          Write-Host "No Change : $nochange"
          Write-Host "==================================="


name: ALZ - Platform-LZ Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

  pull_request:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast
  # ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

  # =========================================================
  # JOB 3 - AZURE VALIDATION
  # =========================================================

  validate:
    name: Azure Validate
    runs-on: ubuntu-latest
    needs: security
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location ${{ env.LOCATION }} \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

  # =========================================================
  # JOB 4 - WHAT-IF SUMMARY
  # =========================================================

  whatif-summary:
    name: What-If Change Summary
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Change Summary
        shell: pwsh
        env:
          AZURE_CLI_DISABLE_PROGRESS: true
        run: |
          # 1. Exécuter what-if SANS --query
          $result = az deployment mg what-if `
              --name platform-lz-whatif `
              --management-group-id "${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}" `
              --location "${{ env.LOCATION }}" `
              --template-file ./platform.bicep `
              --parameters ./platform.bicepparam `
              --output json 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Échec de what-if :"
              Write-Host $result
              exit 1
          }

          # 2. Nettoyer la sortie : certains warnings (ex: bicep path) peuvent précéder le JSON.
          #    On extrait tout ce qui commence par '{' ou '['
          $cleanJson = $result -join "`n"
          $start = $cleanJson.IndexOf('{')
          if ($start -eq -1) { $start = $cleanJson.IndexOf('[') }
          if ($start -eq -1) {
              Write-Host "❌ Aucun JSON trouvé dans la sortie. Sortie brute :"
              Write-Host $cleanJson
              exit 1
          }
          $jsonText = $cleanJson.Substring($start)

          # 3. Parser le JSON
          try {
              $whatif = $jsonText | ConvertFrom-Json
          } catch {
              Write-Host "❌ Erreur de parsing JSON. Extrait reçu :"
              Write-Host $jsonText
              exit 1
          }

          # 4. Extraire les changements (la propriété peut être 'changes' ou 'change')
          $changes = $whatif.properties.changes
          if (-not $changes) {
              Write-Host "Aucune propriété 'changes' trouvée dans la réponse."
              $whatif | ConvertTo-Json -Depth 5 | Write-Host
              exit 1
          }

          # 5. Regroupement
          $created   = @($changes | Where-Object { $_.changeType -eq "Create" })
          $deleted   = @($changes | Where-Object { $_.changeType -eq "Delete" })
          $modified  = @($changes | Where-Object { $_.changeType -eq "Modify" })
          $nochange  = @($changes | Where-Object { $_.changeType -eq "NoChange" })

          # 6. Résumé
          Write-Host ""
          Write-Host "==================================="
          Write-Host "Platform-LZ Change Summary"
          Write-Host "==================================="
          Write-Host "Created   : $($created.Count)"
          Write-Host "Deleted   : $($deleted.Count)"
          Write-Host "Modified  : $($modified.Count)"
          Write-Host "No Change : $($nochange.Count)"
          Write-Host "==================================="

          # 7. Détails (optionnel)
          if ($created)   { Write-Host "`n===== CRÉÉES ====="; $created   | Select-Object resourceId, changeType | Format-Table -AutoSize }
          if ($deleted)   { Write-Host "`n===== SUPPRIMÉES ====="; $deleted   | Select-Object resourceId, changeType | Format-Table -AutoSize }
          if ($modified)  { Write-Host "`n===== MODIFIÉES ====="; $modified  | Select-Object resourceId, changeType | Format-Table -AutoSize }
          if ($nochange)  { Write-Host "`n===== AUCUN CHANGEMENT ====="; $nochange  | Select-Object resourceId, changeType | Format-Table -AutoSize }
name: ALZ - Platform-LZ Validation

on:
  push:
    paths:
      - 'platform-lz/**/*.bicep'
      - 'platform-lz/**/*.bicepparam'
      - '.github/workflows/platform-lz-validation.yml'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'platform-lz/**/*.bicep'
      - 'platform-lz/**/*.bicepparam'
      - '.github/workflows/platform-lz-validation.yml'
    branches-ignore:
      - main

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

jobs:
  validate:
    name: Validate Bicep & Security
    runs-on: ubuntu-latest
    environment: Sandbox

    env:
      LOCATION: canadaeast
      ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}   # ID du management group racine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}          

      - name: Install Bicep
        run: az bicep install

      # 🔎 Build & Lint tous les fichiers Bicep
      - name: Build & Lint all Bicep files
        run: |
          echo "=== Bicep Validation ==="
          for file in $(find . -name '*.bicep' -not -path '*/\.*'); do
            echo "Building $file"
            az bicep build --file "$file"
            az bicep lint --file "$file"
          done

      # 🔎 Validation des fichiers de paramètres pour la Gestion de la LZ Platform
      - name: Validate parameter files for platform LZ (Management Group scope)
        run: |
          echo "=== Validating Parameter Files for platform LZ ==="
            az deployment mg validate \
              --management-group-id $ROOT_MG_ID \
              --location $LOCATION \
              --template-file ./platform.bicep \
              --parameters ./platform.bicepparam || true

      # 🔎 What-If déploiement des ressources Platform-LZ au niveau du management group racine
      - name: Platform-LZ Resources Deployment What-If
        run: |
          az deployment mg what-if \
            --management-group-id $ROOT_MG_ID \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam
        continue-on-error: true

      # 🔐 PSRule for Azure
      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputType: repository
          inputPath: .
        continue-on-error: false

      # 🔐 Checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: .
          soft_fail: false

      - name: Azure Logout
        if: always()
        run: az logout

name: ALZ - Platform-LZ Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

  pull_request:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast
  # ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

  # =========================================================
  # JOB 3 - AZURE VALIDATION
  # =========================================================

  validate:
    name: Azure Validate
    runs-on: ubuntu-latest
    needs: security
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location ${{ env.LOCATION }} \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

  # =========================================================
  # JOB 4 - WHAT-IF SUMMARY
  # =========================================================

  whatif-summary:
    name: What-If Change Summary
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Change Summary
        shell: pwsh
        env:
          AZURE_CLI_DISABLE_PROGRESS: true
        run: |
          # 1. Run what-if and capture output
          $result = az deployment mg what-if `
              --name platform-lz-whatif `
              --management-group-id "${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}" `
              --location "${{ env.LOCATION }}" `
              --template-file ./platform.bicep `
              --parameters ./platform.bicepparam `
              --output json 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ What-if command failed:"
              Write-Host $result
              exit 1
          }

          # 2. Convert result to string and clean
          $cleanJson = $result -join "`n"
          
          # 3. Extract valid JSON (handle both objects and arrays)
          $start = $cleanJson.IndexOf('{')
          if ($start -eq -1) { $start = $cleanJson.IndexOf('[') }
          if ($start -eq -1) {
              Write-Host "❌ No valid JSON found in output. Raw output:"
              Write-Host $cleanJson
              exit 1
          }
          $jsonText = $cleanJson.Substring($start)

          # 4. Parse JSON with error handling
          try {
              $whatif = $jsonText | ConvertFrom-Json -ErrorAction Stop
          } catch {
              Write-Host "❌ JSON parsing error: $_"
              Write-Host "First 2000 characters:"
              Write-Host $jsonText.Substring(0, [Math]::Min(2000, $jsonText.Length))
              exit 1
          }
              
          # 5. Extract changes
          $changes = $whatif.changes
          if (-not $changes) { $changes = $whatif.properties.changes }
          if (-not $changes) {
              Write-Host "❌ No 'changes' property found. JSON structure:"
              $whatif | ConvertTo-Json -Depth 10 | Write-Host
              exit 1
          }

          # 6. Group changes by type
          $created   = @($changes | Where-Object { $_.changeType -eq "Create" })
          $deleted   = @($changes | Where-Object { $_.changeType -eq "Delete" })
          $modified  = @($changes | Where-Object { $_.changeType -eq "Modify" })
          $nochange  = @($changes | Where-Object { $_.changeType -eq "NoChange" })
          $unsupported = @($changes | Where-Object { $_.changeType -eq "Unsupported" })

          # -------------------------------------------------------
          # 7. GitHub Job Summary  (visible dans l'UI de la PR/run)
          # -------------------------------------------------------
          $summary = [System.Text.StringBuilder]::new()

          # En-tête
          $null = $summary.AppendLine("## 📋 Platform-LZ — What-If Change Summary")
          $null = $summary.AppendLine("")
          $null = $summary.AppendLine("| Type | Count |")
          $null = $summary.AppendLine("|------|-------|")
          $null = $summary.AppendLine("| ✅ Created    | $($created.Count) |")
          $null = $summary.AppendLine("| 🗑️ Deleted    | $($deleted.Count) |")
          $null = $summary.AppendLine("| ✏️ Modified   | $($modified.Count) |")
          $null = $summary.AppendLine("| ➡️ No Change  | $($nochange.Count) |")
          $null = $summary.AppendLine("| ⚠️ Unsupported| $($unsupported.Count) |")
          $null = $summary.AppendLine("")

          # Fonction utilitaire : génère un bloc détail par type
          function Add-Section {
              param(
                  [System.Text.StringBuilder]$sb,
                  [string]$emoji,
                  [string]$title,
                  [array]$items
              )
              if ($items.Count -eq 0) { return }

              $null = $sb.AppendLine("<details>")
              $null = $sb.AppendLine("<summary>$emoji <strong>$title ($($items.Count))</strong></summary>")
              $null = $sb.AppendLine("")
              $null = $sb.AppendLine("| Resource ID | Type de changement |")
              $null = $sb.AppendLine("|-------------|-------------------|")

              foreach ($item in $items) {
                  $rid = $item.resourceId
                  $ct  = $item.changeType

                  # Détail des propriétés modifiées (uniquement pour Modify)
                  if ($ct -eq "Modify" -and $item.delta) {
                      $props = ($item.delta | ForEach-Object { $_.path }) -join ", "
                      $null = $sb.AppendLine("| ``$rid`` | $ct — props: ``$props`` |")
                  } else {
                      $null = $sb.AppendLine("| ``$rid`` | $ct |")
                  }
              }

              $null = $sb.AppendLine("")
              $null = $sb.AppendLine("</details>")
              $null = $sb.AppendLine("")
          }

          Add-Section -sb $summary -emoji "✅" -title "Created"     -items $created
          Add-Section -sb $summary -emoji "🗑️" -title "Deleted"     -items $deleted
          Add-Section -sb $summary -emoji "✏️" -title "Modified"    -items $modified
          Add-Section -sb $summary -emoji "➡️" -title "No Change"   -items $nochange
          Add-Section -sb $summary -emoji "⚠️" -title "Unsupported" -items $unsupported

          # Métadonnées
          $null = $summary.AppendLine("---")
          $null = $summary.AppendLine("_Run: ``${{ github.run_id }}`` · Branch: ``${{ github.ref_name }}`` · Commit: ``${{ github.sha }}``_")

          # Écriture dans le fichier GITHUB_STEP_SUMMARY
          $summary.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # 8. Optionnel : échec du job si des suppressions sont détectées
          # if ($deleted.Count -gt 0) {
          #     Write-Host "❌ Deployment would DELETE $($deleted.Count) resource(s). Blocking pipeline."
          #     exit 1
          # }

          exit 0
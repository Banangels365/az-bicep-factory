name: ALZ - Platform-LZ Validation

on:
  push:
    paths:
      - 'platform-lz/**/*.bicep'
      - 'platform-lz/**/*.bicepparam'
      - '.github/workflows/platform-lz-validation.yml'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'platform-lz/**/*.bicep'
      - 'platform-lz/**/*.bicepparam'
      - '.github/workflows/platform-lz-validation.yml'
    branches-ignore:
      - main

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

jobs:
  validate:
    name: Validate Bicep Files & Security
    runs-on: ubuntu-latest
    environment: Sandbox

    env:
      LOCATION: canadaeast
      ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      # 🔎 Build & Lint Bicep
      - name: Build & Lint all Bicep files
        run: |
          echo "=== Bicep Validation ==="
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Building $file"
            az bicep build --file "$file"
            az bicep lint --file "$file"
          done

      # 🔎 Validation ARM au scope Management Group
      - name: Validate Platform-LZ deployment (Management Group scope)
        continue-on-error: true
        run: |
          echo "=== Validating Platform-LZ Deployment ==="
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id $ROOT_MG_ID \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

      # 🔎 What-If propre et lisible
      - name: Platform-LZ What-If (Management Group scope)
        run: |
          echo "=== What-If Platform-LZ ==="
          az deployment mg what-if \
            --name platform-lz-whatif \
            --management-group-id $ROOT_MG_ID \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam \
            --what-if-result-format FullResourcePayloads

      # 🔐 PSRule for Azure
      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputType: repository
          inputPath: .

      # 🔐 Checkov
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: .
          soft_fail: false

      - name: Azure Logout
        if: always()
        run: az logout

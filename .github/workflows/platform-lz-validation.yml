name: ALZ - Platform-LZ Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

  pull_request:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast
  # ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

  # =========================================================
  # JOB 3 - AZURE VALIDATION
  # =========================================================

  validate:
    name: Azure Validate
    runs-on: ubuntu-latest
    needs: security
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location ${{ env.LOCATION }} \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

  # =========================================================
  # JOB 4 - WHAT-IF SUMMARY
  # =========================================================

  whatif-summary:
    name: What-If Change Summary
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Change Summary
        shell: pwsh
        run: |
          # 1. Capture la sortie brute en texte
          $changes = az deployment mg what-if `
              --name platform-lz-whatif `
              --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} `
              --location ${{ env.LOCATION }} `
              --template-file ./platform.bicep `
              --parameters ./platform.bicepparam `
              --query "changes[].{id:resourceId, type:changeType}" `
              --output tsv 2>$null

          # 2. Si aucune sortie
          if (-not $changes) {
              Write-Host "Aucun changement détecté."
              exit 0
          }

          # 3. Convertir TSV → objets PowerShell
          $parsed = $changes | ForEach-Object {
              $parts = $_ -split "`t"
              [PSCustomObject]@{
                  ResourceId = $parts[0]
                  ChangeType = $parts[1]
              }
          }

          # 4. Regroupement par catégorie
          $created   = $parsed | Where-Object ChangeType -eq "Create"
          $deleted   = $parsed | Where-Object ChangeType -eq "Delete"
          $modified  = $parsed | Where-Object ChangeType -eq "Modify"
          $nochange  = $parsed | Where-Object ChangeType -eq "NoChange"

          # 5. Résumé global
          Write-Host ""
          Write-Host "==================================="
          Write-Host "Platform-LZ Change Summary"
          Write-Host "==================================="
          Write-Host "Created   : $($created.Count)"
          Write-Host "Deleted   : $($deleted.Count)"
          Write-Host "Modified  : $($modified.Count)"
          Write-Host "No Change : $($nochange.Count)"
          Write-Host "==================================="

          # 6. Détails par catégorie
          Write-Host ""
          Write-Host "===== CRÉÉES ====="
          $created | Format-Table -AutoSize

          Write-Host ""
          Write-Host "===== SUPPRIMÉES ====="
          $deleted | Format-Table -AutoSize

          Write-Host ""
          Write-Host "===== MODIFIÉES ====="
          $modified | Format-Table -AutoSize

          Write-Host ""
          Write-Host "===== AUCUN CHANGEMENT ====="
          $nochange | Format-Table -AutoSize
name: ALZ - Platform-LZ Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

  pull_request:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast
  # ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

  # =========================================================
  # JOB 3 - AZURE VALIDATION
  # =========================================================

  validate:
    name: Azure Validate
    runs-on: ubuntu-latest
    needs: security
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location ${{ env.LOCATION }} \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

  # =========================================================
  # JOB 4 - WHAT-IF SUMMARY
  # =========================================================

  whatif-summary:
    name: What-If Change Summary
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Change Summary
        shell: pwsh
        env:
          AZURE_CLI_DISABLE_PROGRESS: true
        run: |
          # 1. Run what-if — capturer stdout et stderr séparément
          $rawOutput = az deployment mg what-if `
              --name platform-lz-whatif `
              --management-group-id "${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}" `
              --location "${{ env.LOCATION }}" `
              --template-file ./platform.bicep `
              --parameters ./platform.bicepparam `
              --no-pretty-print 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ What-if command failed:"
              Write-Host $rawOutput
              exit 1
          }

          # 2. Parser le format texte what-if d'Azure CLI
          #    Chaque ressource commence par un symbole en début de ligne :
          #      '+ ' = Create
          #      '- ' = Delete
          #      '~ ' = Modify
          #      '  ' = NoChange (deux espaces)
          #      'x ' = Unsupported

          $created     = [System.Collections.Generic.List[string]]::new()
          $deleted     = [System.Collections.Generic.List[string]]::new()
          $modified    = [System.Collections.Generic.List[string]]::new()
          $nochange    = [System.Collections.Generic.List[string]]::new()
          $unsupported = [System.Collections.Generic.List[string]]::new()

          foreach ($line in $rawOutput) {
              # Les lignes de ressources suivent le pattern : "SYMBOL ResourceType/name [apiVersion]"
              if ($line -match '^(\s{2})([\w.]+/[\w./\-]+)\s') { $nochange.Add($Matches[2]) }
              elseif ($line -match '^\s*\+\s+([\w.]+/[\w./\-]+)\s')  { $created.Add($Matches[1]) }
              elseif ($line -match '^\s*-\s+([\w.]+/[\w./\-]+)\s')   { $deleted.Add($Matches[1]) }
              elseif ($line -match '^\s*~\s+([\w.]+/[\w./\-]+)\s')   { $modified.Add($Matches[1]) }
              elseif ($line -match '^\s*x\s+([\w.]+/[\w./\-]+)\s')   { $unsupported.Add($Matches[1]) }
          }

          # 3. Console log (logs bruts)
          Write-Host "Created    : $($created.Count)"
          Write-Host "Deleted    : $($deleted.Count)"
          Write-Host "Modified   : $($modified.Count)"
          Write-Host "No Change  : $($nochange.Count)"
          Write-Host "Unsupported: $($unsupported.Count)"

          # 4. GitHub Job Summary
          $summary = [System.Text.StringBuilder]::new()

          $null = $summary.AppendLine("## 📋 Platform-LZ — What-If Change Summary")
          $null = $summary.AppendLine("")
          $null = $summary.AppendLine("| Type | Count |")
          $null = $summary.AppendLine("|------|-------|")
          $null = $summary.AppendLine("| ✅ Created     | $($created.Count) |")
          $null = $summary.AppendLine("| 🗑️ Deleted     | $($deleted.Count) |")
          $null = $summary.AppendLine("| ✏️ Modified    | $($modified.Count) |")
          $null = $summary.AppendLine("| ➡️ No Change   | $($nochange.Count) |")
          $null = $summary.AppendLine("| ⚠️ Unsupported | $($unsupported.Count) |")
          $null = $summary.AppendLine("")

          function Add-Section {
              param(
                  [System.Text.StringBuilder]$sb,
                  [string]$emoji,
                  [string]$title,
                  [System.Collections.Generic.List[string]]$items
              )
              if ($items.Count -eq 0) { return }

              $null = $sb.AppendLine("<details>")
              $null = $sb.AppendLine("<summary>$emoji <strong>$title ($($items.Count))</strong></summary>")
              $null = $sb.AppendLine("")
              $null = $sb.AppendLine("| Resource |")
              $null = $sb.AppendLine("|----------|")
              foreach ($item in $items) {
                  $null = $sb.AppendLine("| ``$item`` |")
              }
              $null = $sb.AppendLine("")
              $null = $sb.AppendLine("</details>")
              $null = $sb.AppendLine("")
          }

          Add-Section -sb $summary -emoji "✅" -title "Created"     -items $created
          Add-Section -sb $summary -emoji "🗑️" -title "Deleted"     -items $deleted
          Add-Section -sb $summary -emoji "✏️" -title "Modified"    -items $modified
          Add-Section -sb $summary -emoji "➡️" -title "No Change"   -items $nochange
          Add-Section -sb $summary -emoji "⚠️" -title "Unsupported" -items $unsupported

          $null = $summary.AppendLine("---")
          $null = $summary.AppendLine("_Run: ``${{ github.run_id }}`` · Branch: ``${{ github.ref_name }}`` · Commit: ``${{ github.sha }}``_")

          $summary.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          exit 0
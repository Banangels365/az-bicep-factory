name: ALZ - Platform-LZ Validation

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

  pull_request:
    branches-ignore:
      - main
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

env:
  LOCATION: canadaeast
  # ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

jobs:

  # =========================================================
  # JOB 1 - BICEP LINT
  # =========================================================

  lint:
    name: Build & Lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Build all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

  # =========================================================
  # JOB 2 - SECURITY ANALYSIS
  # =========================================================

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./platform-lz
          soft_fail: true

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

  # =========================================================
  # JOB 3 - AZURE VALIDATION
  # =========================================================

  validate:
    name: Azure Validate
    runs-on: ubuntu-latest
    needs: security
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }} \
            --location ${{ env.LOCATION }} \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

  # =========================================================
  # JOB 4 - WHAT-IF SUMMARY
  # =========================================================

  whatif-summary:
    name: What-If Change Summary
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate Change Summary
        shell: pwsh
        run: |
          # 1. Exécuter what-if en capturant stdout + stderr, sans masquer les erreurs
          $result = az deployment mg what-if `
              --name platform-lz-whatif `
              --management-group-id "***" `
              --location canadaeast `
              --template-file ./platform.bicep `
              --parameters ./platform.bicepparam `
              --query "properties.changes[].{resourceId:resourceId, changeType:changeType}" `
              --output json `
              --no-progress 2>&1

          # 2. Vérifier le code de sortie Azure CLI
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Échec de la commande what-if :"
              Write-Host $result
              exit 1
          }

          # 3. Afficher le contenu brut (pour déboguer)
          Write-Host "🔎 Contenu brut reçu (début) :"
          $result | Out-String -Width 4096 | Select-Object -First 10

          # 4. Convertir le JSON (il peut y avoir des lignes de warning mélangées)
          #    On extrait uniquement la partie JSON (commençant par '[' ou '{')
          $raw = $result | Out-String
          $jsonStart = $raw.IndexOf('[')
          if ($jsonStart -eq -1) { $jsonStart = $raw.IndexOf('{') }
          if ($jsonStart -eq -1) {
              Write-Host "❌ Aucun JSON trouvé dans la sortie."
              Write-Host "Sortie complète :"
              Write-Host $raw
              exit 1
          }
          $jsonText = $raw.Substring($jsonStart)

          try {
              $parsed = $jsonText | ConvertFrom-Json
          } catch {
              Write-Host "❌ Erreur de parsing JSON : $_"
              Write-Host "Extrait JSON à parser :"
              Write-Host $jsonText
              exit 1
          }

          # 5. Regroupement (les noms de propriétés sont maintenant corrects)
          $created   = @($parsed | Where-Object changeType -eq "Create")
          $deleted   = @($parsed | Where-Object changeType -eq "Delete")
          $modified  = @($parsed | Where-Object changeType -eq "Modify")
          $nochange  = @($parsed | Where-Object changeType -eq "NoChange")

          # 6. Résumé
          Write-Host ""
          Write-Host "==================================="
          Write-Host "Platform-LZ Change Summary"
          Write-Host "==================================="
          Write-Host "Created   : $($created.Count)"
          Write-Host "Deleted   : $($deleted.Count)"
          Write-Host "Modified  : $($modified.Count)"
          Write-Host "No Change : $($nochange.Count)"
          Write-Host "==================================="

          # 7. Détails
          if ($created)   { Write-Host "`n===== CRÉÉES ====="; $created   | Format-Table -AutoSize }
          if ($deleted)   { Write-Host "`n===== SUPPRIMÉES ====="; $deleted   | Format-Table -AutoSize }
          if ($modified)  { Write-Host "`n===== MODIFIÉES ====="; $modified  | Format-Table -AutoSize }
          if ($nochange)  { Write-Host "`n===== AUCUN CHANGEMENT ====="; $nochange  | Format-Table -AutoSize }
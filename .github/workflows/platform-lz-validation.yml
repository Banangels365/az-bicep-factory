name: ALZ - Platform-LZ Validation

on:
  push:
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'
    branches-ignore:
      - main
  pull_request:
    paths:
      - 'platform-lz/**'
      - '.github/workflows/platform-lz-validation.yml'
    branches:
      - main # On veut valider quand on cible main

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./platform-lz

jobs:
  validate:
    name: Validate Bicep Files & Security
    # Ne lance le push que s'il n'y a pas de PR associée, sinon laisse l'événement pull_request gérer
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.pull_request == null)
    runs-on: ubuntu-latest
    environment: Sandbox

    env:
      LOCATION: canadaeast
      ROOT_MG_ID: ${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}

      
    # --- ÉTAPE 1 : ANALYSE STATIQUE (Rapide & Gratuit) ---
    # Remarque: les en-têtes 'Step X' ont été commentés car ils créaient des clés YAML invalides
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Lint all Bicep files
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            az bicep build --file "$file"
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./platform-lz
          framework: bicep
          soft_fail: false # Bloque si erreurs de sécurité

      - name: PSRule for Azure
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputPath: ./platform-lz

      # --- ÉTAPE 2 : VALIDATION AZURE (Nécessite Connexion) ---
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- Step 3: Validate & What-If ---
      - name: Validate Platform-LZ deployment
        run: |
          az deployment mg validate \
            --name platform-lz-validation \
            --management-group-id $ROOT_MG_ID \
            --location $LOCATION \
            --template-file ./platform.bicep \
            --parameters ./platform.bicepparam

      # --- Step 3.1: Generate Change Summary Report from What-If ---
      - name: Generate Change Summary Report
        shell: pwsh
        run: |
          # Exécuter what-if et capturer directement la sortie JSON en PowerShell
          $whatIfJson = az deployment mg what-if `
            --name platform-lz-whatif `
            --management-group-id $env:ROOT_MG_ID `
            --location $env:LOCATION `
            --template-file ./platform.bicep `
            --parameters ./platform.bicepparam `
            --output json 2>&1

          # Vérifier si la commande a réussi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Erreur lors de l'exécution de what-if:" -ForegroundColor Red
            Write-Host $whatIfJson
            exit 1
          }

          # Extraire uniquement le JSON valide (élimine les notes/avertissements)
          try {
            # Chercher le début du JSON (première accolade)
            $jsonStart = $whatIfJson.IndexOf('{' )
            if ($jsonStart -eq -1) {
              throw "Aucun JSON trouvé dans la sortie"
            }
            $jsonOnly = $whatIfJson.Substring($jsonStart)
            $whatIfOutput = $jsonOnly | ConvertFrom-Json
          } catch {
            Write-Host "❌ Erreur : Impossible de parser le JSON" -ForegroundColor Red
            Write-Host "Sortie reçue:" -ForegroundColor Yellow
            Write-Host $whatIfJson
            exit 1
          }

          # Extraire et traiter les changements
          $changes = $whatIfOutput.changes | Select-Object -Property resourceId, changeType

          # Comptage des changements
          $created = ($changes | Where-Object { $_.changeType -eq 'Create' } | Measure-Object).Count
          $deleted = ($changes | Where-Object { $_.changeType -eq 'Delete' } | Measure-Object).Count
          $modified = ($changes | Where-Object { $_.changeType -eq 'Modify' } | Measure-Object).Count
          $nochange = ($changes | Where-Object { $_.changeType -eq 'NoChange' } | Measure-Object).Count

          # Affichage du rapport dans la console
          Write-Host "" -ForegroundColor Green
          Write-Host "╔═════════════════════════════════════════════════════════════════╗" -ForegroundColor Green
          Write-Host "║        📊 RÉSUMÉ DES CHANGEMENTS - PLATEFORME-LZ              ║" -ForegroundColor Green
          Write-Host "╠═════════════════════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║ ✅ Ressources créées       : $($created.ToString().PadRight(39)) ║" -ForegroundColor Green
          Write-Host "║ ❌ Ressources supprimées   : $($deleted.ToString().PadRight(39)) ║" -ForegroundColor Green
          Write-Host "║ ✏️  Ressources modifiées   : $($modified.ToString().PadRight(39)) ║" -ForegroundColor Green
          Write-Host "║ ➡️  Ressources inchangées  : $($nochange.ToString().PadRight(39)) ║" -ForegroundColor Green
          Write-Host "╠═════════════════════════════════════════════════════════════════╣" -ForegroundColor Green
          Write-Host "║ 📦 TOTAL RESSOURCES        : $($changes.Count.ToString().PadRight(39)) ║" -ForegroundColor Green
          Write-Host "╚═════════════════════════════════════════════════════════════════╝" -ForegroundColor Green
          Write-Host ""

          # Tableau détaillé des changements
          Write-Host "📋 DÉTAIL DES RESSOURCES PAR TYPE :" -ForegroundColor Cyan
          Write-Host ""

          if ($created -gt 0) {
            Write-Host "✅ CRÉÉES ($created) :" -ForegroundColor Green
            $changes | Where-Object { $_.changeType -eq 'Create' } | Format-Table -Property @{Name="Ressource";Expression={$_.resourceId}} -AutoSize
          }

          if ($modified -gt 0) {
            Write-Host "✏️  MODIFIÉES ($modified) :" -ForegroundColor Yellow
            $changes | Where-Object { $_.changeType -eq 'Modify' } | Format-Table -Property @{Name="Ressource";Expression={$_.resourceId}} -AutoSize
          }

          if ($deleted -gt 0) {
            Write-Host "❌ SUPPRIMÉES ($deleted) :" -ForegroundColor Red
            $changes | Where-Object { $_.changeType -eq 'Delete' } | Format-Table -Property @{Name="Ressource";Expression={$_.resourceId}} -AutoSize
          }

          if ($nochange -gt 0) {
            Write-Host "➡️  INCHANGÉES (Aperçu - $nochange) :" -ForegroundColor Cyan
            $changes | Where-Object { $_.changeType -eq 'NoChange' } | Select-Object -First 5 | Format-Table -Property @{Name="Ressource";Expression={$_.resourceId}} -AutoSize
            if ($nochange -gt 5) {
              Write-Host "   ... et $($nochange - 5) autres ressources inchangées" -ForegroundColor Cyan
            }
          }

          # Écrire un résumé Markdown dans GITHUB_STEP_SUMMARY pour l'affichage dans l'UI
          $markdownSummary = @"

          ## 📊 Résumé des Changements - Platform-LZ

          | Type | Nombre |
          |------|--------|
          | ✅ Créées | $created |
          | ❌ Supprimées | $deleted |
          | ✏️ Modifiées | $modified |
          | ➡️ Inchangées | $nochange |
          | **📦 Total** | **$($changes.Count)** |
          
          "@

          if ($created -gt 0) {
            $markdownSummary += "`n### ✅ Ressources Créées ($created)\`n"
            $changes | Where-Object { $_.changeType -eq 'Create' } | ForEach-Object {
              $markdownSummary += "- \`$($_.resourceId)\`  \`n"
            }
          }

          if ($modified -gt 0) {
            $markdownSummary += "`n### ✏️ Ressources Modifiées ($modified)\`n"
            $changes | Where-Object { $_.changeType -eq 'Modify' } | ForEach-Object {
              $markdownSummary += "- \`$($_.resourceId)\`  \`n"
            }
          }

          if ($deleted -gt 0) {
            $markdownSummary += "`n### ❌ Ressources Supprimées ($deleted)\`n"
            $changes | Where-Object { $_.changeType -eq 'Delete' } | ForEach-Object {
              $markdownSummary += "- \`$($_.resourceId)\`  \`n"
            }
          }

          # Ajouter le résumé à GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $markdownSummary
          Write-Host "`n✅ Résumé écrit dans GITHUB_STEP_SUMMARY" -ForegroundColor Green

      - name: Azure Logout
        if: always()
        run: az logout
name: ALZ - Connectivity-LZ Deployment

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'connectivity-lz/**'
      - '.github/workflows/connectivity-lz-deploy.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: ./connectivity-lz

env:
  LOCATION: canadaeast

jobs:

  # =========================================================
  # JOB 1 - VALIDATION & SECURITY
  # =========================================================
  validate:
    name: Validation & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bicep doit être installé avant az bicep build
      - name: Install Bicep
        run: az bicep install

      - name: Build & Lint Bicep
        run: |
          for file in $(find . -name '*.bicep' -not -path './.git/*'); do
            echo "Validating $file"
            az bicep build --file "$file"
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: bicep
          directory: ./connectivity-lz
          soft_fail: false

  # =========================================================
  # JOB 2 - WHAT-IF & CHANGE SUMMARY
  # =========================================================
  whatif:
    name: What-If Analysis
    runs-on: ubuntu-latest
    needs: validate
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If Connectivity-LZ
        shell: pwsh
        run: |
          $output = az deployment mg what-if `
            --name connectivity-lz-whatif `
            --management-group-id "${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}" `
            --location "${{ env.LOCATION }}" `
            --template-file ./connectivity.bicep `
            --parameters ./connectivity.bicepparam `
            --no-pretty-print 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ What-if failed:"
              $output | Write-Host
              exit 1
          }

          # Rejoindre les lignes et valider que le JSON est parseable avant de sauvegarder
          $json = $output -join "`n"
          try {
              $null = $json | ConvertFrom-Json -ErrorAction Stop
          } catch {
              Write-Host "❌ La sortie du what-if n'est pas du JSON valide : $_"
              exit 1
          }

          $json | Out-File whatif-output.json -Encoding utf8
          Write-Host "✅ whatif-output.json sauvegardé."

      - name: Generate What-If Change Summary
        shell: pwsh
        run: |
          if (-not (Test-Path whatif-output.json)) {
              Write-Host "❌ Fichier whatif-output.json introuvable."
              exit 1
          }

          # Parser le JSON — la racine est { "changes": [...] }
          $whatif  = Get-Content whatif-output.json -Raw | ConvertFrom-Json
          $changes = $whatif.changes
          if (-not $changes) { $changes = $whatif.properties.changes }

          # Groupement par changeType
          $created     = @($changes | Where-Object { $_.changeType -eq "Create" })
          $deleted     = @($changes | Where-Object { $_.changeType -eq "Delete" })
          $modified    = @($changes | Where-Object { $_.changeType -eq "Modify" })
          $nochange    = @($changes | Where-Object { $_.changeType -eq "NoChange" })
          $unsupported = @($changes | Where-Object { $_.changeType -eq "Unsupported" })

          # Console log
          Write-Host "Created    : $($created.Count)"
          Write-Host "Deleted    : $($deleted.Count)"
          Write-Host "Modified   : $($modified.Count)"
          Write-Host "No Change  : $($nochange.Count)"
          Write-Host "Unsupported: $($unsupported.Count)"

          # Extraction lisible du resourceId
          function Get-ResourceInfo {
              param([string]$resourceId)
              if ($resourceId -match '/providers/([^/]+/[^/]+)/([^/]+)$') {
                  return [PSCustomObject]@{ Type = $Matches[1]; Name = $Matches[2] }
              } elseif ($resourceId -match '/managementGroups/([^/]+)$') {
                  return [PSCustomObject]@{ Type = "Microsoft.Management/managementGroups"; Name = $Matches[1] }
              }
              return [PSCustomObject]@{ Type = "Azure Resource"; Name = ($resourceId -split '/' | Select-Object -Last 1) }
          }

          # Sections dépliables
          function Add-Section {
              param(
                  [System.Text.StringBuilder]$sb,
                  [string]$emoji,
                  [string]$title,
                  [array]$items
              )
              if ($items.Count -eq 0) { return }

              $null = $sb.AppendLine("<details>")
              $null = $sb.AppendLine("<summary>$emoji <strong>$title ($($items.Count))</strong></summary>")
              $null = $sb.AppendLine("")
              $null = $sb.AppendLine("| # | Type de ressource | Nom |")
              $null = $sb.AppendLine("|---|-------------------|-----|")

              $i = 1
              foreach ($item in $items) {
                  $info = Get-ResourceInfo -resourceId $item.resourceId
                  if ($item.changeType -eq "Modify" -and $item.delta) {
                      $props = ($item.delta | ForEach-Object { $_.path }) -join ", "
                      $null = $sb.AppendLine("| $i | ``$($info.Type)`` | **$($info.Name)** _(Modifié: $props)_ |")
                  } else {
                      $null = $sb.AppendLine("| $i | ``$($info.Type)`` | $($info.Name) |")
                  }
                  $i++
              }
              $null = $sb.AppendLine("")
              $null = $sb.AppendLine("</details>")
              $null = $sb.AppendLine("")
          }

          $summary = [System.Text.StringBuilder]::new()
          $null = $summary.AppendLine("## 🔍 Connectivity-LZ - Prévision des modifications (What-If)")
          $null = $summary.AppendLine("")
          $null = $summary.AppendLine("| Statut attendu | Quantité |")
          $null = $summary.AppendLine("|----------------|----------|")
          $null = $summary.AppendLine("| ✅ À Créer          | $($created.Count) |")
          $null = $summary.AppendLine("| 🗑️ À Supprimer       | $($deleted.Count) |")
          $null = $summary.AppendLine("| ✏️ À Modifier      | $($modified.Count) |")
          $null = $summary.AppendLine("| ➡️ Sans Changement  | $($nochange.Count) |")
          $null = $summary.AppendLine("| ⚠️ Non Supporté      | $($unsupported.Count) |")
          $null = $summary.AppendLine("")

          Add-Section -sb $summary -emoji "✅" -title "À Créer"          -items $created
          Add-Section -sb $summary -emoji "🗑️" -title "À Supprimer"      -items $deleted
          Add-Section -sb $summary -emoji "✏️" -title "À Modifier"       -items $modified
          Add-Section -sb $summary -emoji "➡️" -title "Sans Changement"  -items $nochange
          Add-Section -sb $summary -emoji "⚠️" -title "Non Supporté"     -items $unsupported

          $null = $summary.AppendLine("---")
          $null = $summary.AppendLine("_Run: ``${{ github.run_id }}`` · Branch: ``${{ github.ref_name }}`` · Commit: ``${{ github.sha }}``_")

          $summary.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Azure Logout
        if: always()
        run: az logout

  # =========================================================
  # JOB 3 - DEPLOYMENT
  # =========================================================
  deploy:
    name: Deploy Connectivity-LZ
    runs-on: ubuntu-latest
    needs: whatif
    environment: Sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Connectivity-LZ
        shell: pwsh
        run: |
          $output = az deployment mg create `
            --name connectivity-lz-deploy `
            --management-group-id "${{ secrets.AZURE_ROOT_MANAGEMENT_GROUP }}" `
            --location "${{ env.LOCATION }}" `
            --template-file ./connectivity.bicep `
            --parameters ./connectivity.bicepparam `
            --output json 2>stderr.txt

          $stderr = Get-Content stderr.txt -Raw -ErrorAction SilentlyContinue

          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Deployment failed"
              Write-Host "=== STDERR COMPLET ==="
              Write-Host $stderr
              Write-Host "=== STDOUT ==="
              $output | Write-Host

              # Tenter de parser le JSON d'erreur pour extraire les details imbriqués
              try {
                  $errJson = $stderr | ConvertFrom-Json -ErrorAction Stop
                  Write-Host "`n=== ERREURS DÉTAILLÉES ==="
                  $errJson.error.details | ForEach-Object {
                      Write-Host "--- $($_.code) : $($_.target) ---"
                      Write-Host $_.message
                      $_.details | ForEach-Object {
                          Write-Host "  >> $($_.code) : $($_.message)"
                          $_.details | ForEach-Object {
                              Write-Host "    >> $($_.code) : $($_.message)"
                          }
                      }
                  }
              } catch {
                  Write-Host "(Impossible de parser l'erreur en JSON)"
              }
              exit 1
          }

          $output -join "`n" | Out-File deploy-output.json -Encoding utf8
          Write-Host "✅ Déploiement complété."

      - name: Generate Deployment Summary
        if: always()
        shell: pwsh
        run: |
          $summary = [System.Text.StringBuilder]::new()

          # En-tête avec statut global
          if ($env:DEPLOY_STATUS -eq "success" -or (Test-Path deploy-output.json)) {
              $null = $summary.AppendLine("## 🚀 Connectivity-LZ - Résumé du déploiement")
              $null = $summary.AppendLine("")
              $null = $summary.AppendLine("> ✅ **Déploiement complété avec succès**")
          } else {
              $null = $summary.AppendLine("## 🚀 Connectivity-LZ - Résumé du déploiement")
              $null = $summary.AppendLine("")
              $null = $summary.AppendLine("> ❌ **Déploiement en échec - consulter les logs du job**")
          }
          $null = $summary.AppendLine("")

          if (Test-Path deploy-output.json) {
              try {
                  $deployment = Get-Content deploy-output.json -Raw | ConvertFrom-Json -ErrorAction Stop

                  # Métadonnées du déploiement
                  $props         = $deployment.properties
                  $provisionState = $props.provisioningState
                  $duration      = $props.duration
                  $timestamp     = $props.timestamp
                  $deployName    = $deployment.name

                  $null = $summary.AppendLine("| Propriété | Valeur |")
                  $null = $summary.AppendLine("|-----------|--------|")
                  $null = $summary.AppendLine("| Nom du déploiement   | ``$deployName`` |")
                  $null = $summary.AppendLine("| État                 | $provisionState |")
                  $null = $summary.AppendLine("| Horodatage           | $timestamp |")
                  $null = $summary.AppendLine("| Durée                | $duration |")
                  $null = $summary.AppendLine("")

                  # Ressources déployées via outputResources
                  $resources = $props.outputResources
                  if ($resources -and $resources.Count -gt 0) {
                      $null = $summary.AppendLine("<details>")
                      $null = $summary.AppendLine("<summary>📦 <strong>Ressources déployées ($($resources.Count))</strong></summary>")
                      $null = $summary.AppendLine("")
                      $null = $summary.AppendLine("| # | Ressource |")
                      $null = $summary.AppendLine("|---|-----------|")

                      $i = 1
                      foreach ($res in $resources) {
                          $rid = $res.id
                          # Extraire la partie lisible après le dernier /providers/
                          $label = if ($rid -match '/providers/([^/]+/[^/]+/[^/]+)$') { $Matches[1] } else { $rid -split '/' | Select-Object -Last 1 }
                          $null = $summary.AppendLine("| $i | ``$label`` |")
                          $i++
                      }
                      $null = $summary.AppendLine("")
                      $null = $summary.AppendLine("</details>")
                      $null = $summary.AppendLine("")
                  }

              } catch {
                  $null = $summary.AppendLine("⚠️ _Impossible de parser la sortie du déploiement : $_")
                  $null = $summary.AppendLine("")
              }
          } else {
              $null = $summary.AppendLine("⚠️ _Fichier de sortie du déploiement introuvable._")
              $null = $summary.AppendLine("")
          }

          $null = $summary.AppendLine("---")
          $null = $summary.AppendLine("_Run: ``${{ github.run_id }}`` · Branch: ``${{ github.ref_name }}`` · Commit: ``${{ github.sha }}``_")

          $summary.ToString() | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Azure Logout
        if: always()
        run: az logout